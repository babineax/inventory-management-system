name: inventory_management_system
description: Smart Inventory Management System
publish_to: "none"
version: 3.2.0+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  community_charts_flutter: ^1.0.2
  intl: ^0.17.0
  pdf: ^3.10.8
  printing: ^5.13.3
  # pdf: ^3.10.7
  # printing: ^5.12.0
  screenshot: ^2.1.0
  fl_chart: ^0.68.0
  # fl_chart: ^1.0.0
  file_picker: ^10.3.2
  file_selector: ^1.0.3
  file_saver: ^0.2.12
  cupertino_icons: ^1.0.6
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  google_fonts: ^6.3.0
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  provider: ^6.0.5
  flutter_staggered_animations: ^1.1.1
  firebase_storage: ^13.0.0
  uuid: ^4.5.1
  animations: ^2.0.11
  shared_preferences: ^2.2.2
  mobile_scanner: ^7.0.1
  connectivity_plus: ^6.0.5
  http: ^1.1.0
  mailer: ^6.0.1
  cron: ^0.6.0
  share_plus: ^7.2.2
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon6.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon6.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon6.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon6.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
